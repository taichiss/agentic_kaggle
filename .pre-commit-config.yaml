repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: project-lint
        name: project-lint
        entry: uv run python scripts/quality_gate.py lint
        language: system
        pass_filenames: false
      - id: project-typecheck
        name: project-typecheck
        entry: uv run python scripts/quality_gate.py typecheck
        language: system
        pass_filenames: false
      - id: project-arch
        name: project-arch
        entry: uv run python scripts/quality_gate.py arch
        language: system
        pass_filenames: false

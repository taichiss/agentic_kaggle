[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celltrack-workspace"
version = "0.1.0"
description = "Kaggle Biohub Cell Tracking During Development workspace."
requires-python = ">=3.11"
dependencies = [
  "kaggle>=1.7.4.5",
  "numpy>=2.3.4",
  "pandas>=2.3.3",
  "pyarrow>=22.0.0",
  "scikit-learn>=1.7.2",
  "scipy>=1.16.3",
  # zarr I/O for 3D+Time imaging data
  "zarr>=3.0.0",
  "networkx>=3.4.0",
  "joblib>=1.5.0",
  "tqdm>=4.66.0",
  "ipykernel>=7.2.0",
  "nbconvert>=7.17.1",
  "matplotlib>=3.10.9",
  "zstandard>=0.25.0",
  "rdkit>=2024.3.0",
  "numba>=0.68.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
  "ruff>=0.13.0",
  "pytest>=8.0.0",
]

[project.optional-dependencies]
# Visualization for local EDA (not needed in Kaggle kernels)
viz = [
  "napari",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-kaggle"
version = "0.1.0"
description = "ADR-driven, competition-agnostic Kaggle agent workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "kaggle>=2.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
kaggle-init = "agentic_kaggle.cli:main"
kaggle-lb = "agentic_kaggle.leaderboard:main"
harness_check = "agentic_kaggle.harness.checks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
